name: generated-consistency

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generated-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify committed generated surfaces without writing
        run: python3 10_Agents/tools/skill_adapters/check_generated.py
