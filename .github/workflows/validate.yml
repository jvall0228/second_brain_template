# Manual validation workflow.
# Automatic read-only checks live in generated-consistency.yml and tool-tests.yml.
# Run this workflow on demand from the GitHub Actions UI when full vault
# validation and generated-file refresh are desired.
name: validate

concurrency:
  group: manual-vault-repair-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unit tests (all tools)
        run: python3 10_Agents/tools/run_tests.py
      - name: verify project-local skill adapters (issue #82)
        run: python3 10_Agents/tools/skill_adapters/gen_skill_adapters.py --check
      - name: regenerate bootstrap + index + snippets + skill adapters (PRD §18, §6.5, spec §28)
        run: |
          python3 10_Agents/tools/brain/brain.py bootstrap --write --shared-only
          python3 10_Agents/tools/brain/brain.py bootstrap --check --shared-only
          python3 10_Agents/tools/brain/brain.py index --shared-only
          python3 10_Agents/tools/vscode/gen_snippets.py
          python3 10_Agents/tools/skill_adapters/gen_skill_adapters.py
          python3 10_Agents/tools/skill_adapters/gen_skill_adapters.py --check
      - name: verify explicit-write local artifacts (issue #23)
        run: python3 10_Agents/tools/brain/brain.py artifacts --check --shared-only
      - name: brain validate
        run: |
          set +e
          python3 10_Agents/tools/brain/brain.py validate --shared-only
          ec=$?
          case "$ec" in
            0|2) exit 0 ;;
            *) exit "$ec" ;;
          esac
      - name: commit regenerated files
        run: |
          git add 00_Meta/BOOTSTRAP.md 10_Agents/tools/brain/vault-index.json .vscode/second-brain.code-snippets .agents/skills .claude/skills
          if git diff --cached --quiet; then
            echo "generated files already fresh — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: regenerate vault index and snippets"
          git push
