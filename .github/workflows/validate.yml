# CI backstop for clones without the pre-commit hook installed (PRD §18):
# run the executable test suite, check generated editor surfaces, rebuild the
# vault index, fail if it differs from the committed copy, and run the full
# validation suite. Validation warnings (exit 2) pass; only errors (exit 1)
# fail the run — same contract as the hook.
name: validate

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unit tests
        run: python3 -m unittest discover -s 10_Agents/tools/brain/tests
      - name: snippet parity (PRD §6.5)
        run: python3 10_Agents/tools/vscode/gen_snippets.py --check
      - name: refresh index on implementation branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/shared-second-brain-registration'
        run: |
          python3 10_Agents/tools/brain/brain.py index
          if ! git diff --quiet -- 10_Agents/tools/brain/vault-index.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add 10_Agents/tools/brain/vault-index.json
            git commit -m 'Regenerate vault index for shared registration'
            git push
          fi
      - name: brain validate --check-index
        run: |
          set +e
          python3 10_Agents/tools/brain/brain.py validate --check-index
          ec=$?
          case "$ec" in
            0|2) exit 0 ;;
            *) exit "$ec" ;;
          esac
