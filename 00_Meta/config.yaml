# Vault config — read by `brain` (10_Agents/tools/brain/brain.py).
# Contract: 10_Agents/tools/brain/spec.md §15. Optional by design: with this
# file absent (or, as shipped, all comments) every behavior stays at its
# built-in default. Inspect the effective result with `brain config`.
#
# Grammar is the bounded YAML subset only (no pyyaml, no full YAML):
# scalars, flat lists, and one level of nested mapping. Comments are
# FULL-LINE only — a trailing "# ..." after a value is not a comment, it
# becomes part of the value. Unknown keys are tolerated (validate warns);
# malformed lines are per-file validate errors.
#
# Change control: not a note (no frontmatter), but treat it like the
# canonical meta docs beside it — changes go through PRD §6.3 review,
# the CLAUDE.md precedent.
#
# ---------------------------------------------------------------------------
# Implemented keys — uncomment an example line to override (keep the
# explanation lines commented; only the bare key/value lines are grammar).
#
# Extra directories agents may write to, beyond the Inbox-first defaults
# (02_Inbox/, 02_Outbox/, 10_Agents/solutions/). Vault-relative dirs only.
#
# write_exceptions:
#   - 06_Resources/
#
# VS Code extension trust policy (PRD §6.5): first-party (default) |
# relaxed. `relaxed` records that this fork admits community extensions
# (e.g. Foam) — see 06_Resources/vscode-editor-support.md.
#
# extension_trust: relaxed
#
# Fork context (issue #12): personal (default) | work. Recorded by
# onboard-owner's specialization step, which rewrites the periodic
# templates in place from 09_Templates/variants/ for a work fork.
# A record, not a switch — brain parses and reports it but drives no
# behavior from it.
#
# context: work
#
# Health-report thresholds (spec §16.4), integers in days:
# stale_days — status/active notes older than this are stale (default 30);
# inbox_days — Inbox notes older than this count as triage debt (default 14).
#
# report:
#   stale_days: 30
#   inbox_days: 14
#
# Upstream template version (issue #6): the upstream second_brain_template
# release this fork has adopted — by convention the upstream release tag.
# Written by the sync-upstream skill after a completed sync; the skill
# compares this value against the upstream repo's template-v* git tags to
# find pending releases. Free-form string; a record, not a switch — brain
# parses and reports it (`brain config`) but drives no behavior from it.
#
# template_version: template-v1.2.0
#
# ---------------------------------------------------------------------------
# Reserved keys (parsed and tolerated, not yet implemented — claimed by
# open issues): environments, modules, provenance, sync.
